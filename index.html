<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Recorder · English Language Check</title>
<style>
  :root { --navy:#1B3A5C; --teal:#2A9488; --ink:#1f2d3a; --muted:#5b6b7b; --line:#d6dee6; --red:#a83c32; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial, Helvetica, sans-serif; color:var(--ink); background:#f5f7fa; font-size:17px; line-height:1.5; }
  header { background:var(--navy); color:#fff; padding:12px 18px; font-weight:bold; display:flex; justify-content:space-between; }
  main { padding:16px 18px; max-width:620px; margin:auto; }
  .prompt { background:#eef3f8; border-left:5px solid var(--navy); padding:12px 14px; border-radius:8px; font-weight:bold; }
  .pic { background:#fff; border:1px solid var(--line); border-radius:10px; padding:6px; margin-top:10px; } .pic img { display:block; width:100%; height:auto; max-height:380px; object-fit:contain; }
  .state { text-align:center; font-weight:bold; min-height:26px; margin-top:6px; }
  .rec { color:var(--red); }
  button { font:inherit; font-weight:bold; border:0; border-radius:999px; padding:12px 22px; cursor:pointer; }
  .primary { background:var(--teal); color:#fff; } .stop { background:var(--red); color:#fff; } .ghost { background:#fff; border:1px solid var(--line); color:var(--navy); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:12px 0; }
  .note { font-size:14px; color:var(--muted); text-align:center; }
  .err { color:var(--red); font-weight:bold; text-align:center; }
  audio { width:100%; margin-top:8px; }
  .bar { height:8px; background:#e6ecf1; border-radius:99px; overflow:hidden; width:100%; } .bar i { display:block; height:100%; width:0; background:var(--teal); transition:width .3s; }
</style>
</head>
<body>
<header><span>🎙 Recorder · English Language Check</span><span id="cnt"></span></header>
<main id="app"><p class="note">Getting your questions…</p></main>
<script type="module">
/* This page only records. It has no database and saves nothing.
   Each recording goes straight back to the test window that opened this page.
   The transcript is made on this computer (the speech model runs in the browser); the audio is never sent to an AI service. */
const P = new URLSearchParams(location.search);
const ORIGIN = P.get('o') || '';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const app = $('#app');

// Only Google Apps Script pages (or a local test page) may talk to this recorder.
const validOrigin = /^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(ORIGIN) || /^https?:\/\/localhost(:\d+)?$/.test(ORIGIN);
if (!window.opener || !validOrigin) { app.innerHTML = '<p class="err">Open the recorder from your English Language Check test.</p>'; throw new Error('no opener'); }

let TASKS = [], idx = 0, stream = null, rec = null, chunks = [], blob = null, mime = '', started = 0, seconds = 0, guard = null, player = null;
window.addEventListener('message', e => {
  if (e.origin !== ORIGIN || e.source !== window.opener || !e.data || e.data.type !== 'elp-tasks' || TASKS.length) return;
  const okSrc = (v, kind) => (typeof v === 'string' && v.indexOf('data:' + kind + '/') === 0) ? v : '';
  TASKS = (e.data.tasks || []).slice(0, 15).map(t => ({ id: String(t.id), n: Number(t.n), say: String(t.say || ''),
    image: okSrc(t.image, 'image'), audio: okSrc(t.audio, 'audio'), max: Math.min(240, Number(t.max) || 90) }));
  if (TASKS.length) intro(); else app.innerHTML = '<p class="err">There are no questions to record.</p>';
});
window.opener.postMessage({ type: 'elp-ready' }, ORIGIN);
setTimeout(() => { if (!TASKS.length) app.innerHTML = '<p class="err">The test window did not answer. Close this window and press Start again.</p>'; }, 8000);

function pickMime() { return ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || ''; }
const pic = src => src ? `<div class="pic"><img alt="Picture for this question" src="${src}"></div>` : '';
function stopVoice() { try { if (player) player.pause(); } catch (e) {} try { speechSynthesis.cancel(); } catch (e) {} player = null; }
function say(text, src, onEnd) {
  stopVoice();
  if (src) { player = new Audio(src); player.onended = onEnd; player.play().catch(onEnd); return; }
  const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = 0.9;
  const v = speechSynthesis.getVoices().find(v => /en-US/.test(v.lang)); if (v) u.voice = v;
  u.onend = onEnd; u.onerror = onEnd; speechSynthesis.speak(u);
}

/* ---- Step 1: microphone check ---- */
let meterStop = null;
function meter(el) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)(), an = ctx.createAnalyser(), data = new Uint8Array(256);
  ctx.createMediaStreamSource(stream).connect(an); an.fftSize = 512; let on = true;
  (function loop() { if (!on) return; an.getByteTimeDomainData(data); let m = 0; data.forEach(v => { m = Math.max(m, Math.abs(v - 128)); });
    el.style.width = Math.min(100, m * 1.6) + '%'; requestAnimationFrame(loop); })();
  return () => { on = false; ctx.close(); };
}
function intro() {
  app.innerHTML = `<p><b>You will answer ${TASKS.length} question${TASKS.length > 1 ? 's' : ''}.</b> For each one: <b>listen</b> to the question, press <b>Record</b>, answer, and press <b>Stop</b>.
    There is no timer. Take your time.</p><p><b>First, let’s check your microphone.</b></p>
    <div class="row"><button class="primary" id="go">🎙 Turn on the microphone</button></div><p class="state" id="st"></p>`;
  $('#go').onclick = async () => {
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (e) { $('#st').innerHTML = '<span class="err">The microphone is blocked. Click the microphone icon in the address bar, choose Allow, and try again.</span>'; return; }
    micCheck();
  };
}
function micCheck() {
  app.innerHTML = `<p><b>Microphone check</b></p><p>Say: <i>"My name is … and I am ready."</i> The green bar should move when you talk.</p>
    <div class="bar" style="height:16px"><i id="lv"></i></div>
    <div class="row"><button class="ghost" id="test">⏺ Record a 4-second test</button></div><div id="tp"></div>
    <div class="row"><button class="primary" id="ok" disabled>✓ My microphone works. Start the questions</button></div>
    <p class="note">If the bar does not move, check that the right microphone is selected, or tell your teacher.</p>`;
  meterStop = meter($('#lv'));
  $('#test').onclick = () => {
    const r = new MediaRecorder(stream), c = []; r.ondataavailable = e => c.push(e.data);
    r.onstop = () => { const a = new Audio(URL.createObjectURL(new Blob(c, { type: r.mimeType }))); a.play().catch(() => {});
      $('#tp').innerHTML = `<div class="row"><button class="ghost" id="tplay">▶ Play my test</button></div><p class="note">Listen. Can you hear yourself?</p>`;
      $('#tplay').onclick = () => { a.currentTime = 0; a.play().catch(() => {}); }; $('#test').disabled = false; $('#test').textContent = '⏺ Test again'; $('#ok').disabled = false; };
    r.start(); $('#test').disabled = true; $('#test').textContent = '● Recording the test…'; setTimeout(() => r.stop(), 4000);
  };
  $('#ok').onclick = () => { if (meterStop) meterStop(); showTask(false); };
}

/* ---- Step 2: each question — Listen, Record, Stop ---- */
function showTask(retry) {
  const T = TASKS[idx]; if (!retry) T.tries = 0;
  $('#cnt').textContent = 'Question ' + (idx + 1) + ' of ' + TASKS.length;
  const top = `<p style="margin:0 0 6px"><b>Question ${T.n}</b> · ${retry ? 'You already heard the question.' : 'You will hear the question <b>one time</b>. It is not written on the screen. Listen carefully.'}</p>
    ${T.image ? pic(T.image) : '<div class="pic" style="text-align:center;font-size:64px;padding:30px 0">🎧</div>'}`;
  if (retry || T.heard) {   // the question plays only once: no Listen button after that
    app.innerHTML = top + `<div class="row" id="btns"><button class="primary" id="recb">🎙 Record</button></div>
      <div class="state" id="st">Press Record when you are ready.</div>`;
  } else {
    app.innerHTML = top + `<div class="row" id="btns"><button class="primary" id="listen">🔊 Listen to the question</button><button class="ghost" id="recb" disabled>🎙 Record</button></div>
      <div class="state" id="st">Press Listen. You can listen only one time.</div>`;
    $('#listen').onclick = () => {
      const L = $('#listen'); L.disabled = true; L.textContent = '🔊 Listening…'; T.heard = true;
      const end = () => { const L = $('#listen'), R = $('#recb'); if (!L || !R || !R.disabled) return;
        L.textContent = '✓ Question played'; R.disabled = false; R.className = 'primary'; L.className = 'ghost'; $('#st').textContent = 'When you are ready, press Record.'; };
      say(T.say, T.audio, end);
      setTimeout(end, 25000);   // in case the voice does not finish
    };
  }
  $('#recb').onclick = () => { stopVoice(); record(); };
}

function record() {
  const T = TASKS[idx];
  mime = pickMime(); chunks = [];
  rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
  mime = rec.mimeType || mime || 'audio/webm';
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = () => { clearTimeout(guard); seconds = (Date.now() - started) / 1000; blob = new Blob(chunks, { type: mime }); T.tries = (T.tries || 0) + 1; review(); };
  rec.start(); started = Date.now();
  $('#st').innerHTML = '<span class="rec">● Recording. Speak now. Press Stop when you finish.</span>';
  $('#btns').innerHTML = '<button class="stop" id="stop">■ Stop</button>';
  $('#stop').onclick = () => { if (rec.state === 'recording') rec.stop(); };
  guard = setTimeout(() => { if (rec.state === 'recording') rec.stop(); }, T.max * 1000);   // hidden safety limit
}

const MAX_TRIES = 3;
function review() {
  const T = TASKS[idx];
  if (T.tries >= MAX_TRIES) {   // third recording: it is the answer, go on automatically
    $('#st').textContent = 'That was your last try. Your answer is saved.';
    $('#btns').innerHTML = '';
    setTimeout(() => transcribeAndSend(blob, mime, seconds), 1200);
    return;
  }
  const left = MAX_TRIES - T.tries;
  const player = new Audio(URL.createObjectURL(blob));
  $('#st').textContent = 'Listen to your answer. You can record ' + left + ' more ' + (left === 1 ? 'time' : 'times') + '.';
  $('#btns').innerHTML = `<button class="ghost" id="play">▶ Listen to my answer</button>
    <button class="ghost" id="again">Record again</button><button class="primary" id="use">Use this answer</button>`;
  $('#play').onclick = () => { player.currentTime = 0; player.play().catch(() => {}); };
  $('#again').onclick = () => { player.pause(); showTask(true); };
  $('#use').onclick = () => { player.pause(); transcribeAndSend(blob, mime, seconds); };
}

/* ---- On-device transcript (free; the audio does not leave this computer) ---- */
const CONNECTORS = ['because', 'so', 'but', 'however', 'for example', 'for instance', 'also', 'first', 'second', 'then', 'finally', 'in conclusion', 'another', 'although', 'since', 'therefore', 'in addition', 'on the other hand', 'i think', 'i believe', 'in my opinion'];
function metrics(text, secs) {
  const words = (text.toLowerCase().match(/[a-z']+/g) || []);
  const t = ' ' + text.toLowerCase().replace(/[^a-z' ]/g, ' ').replace(/\s+/g, ' ') + ' ';
  return { seconds: Math.round(secs), words: words.length, wordsPerMinute: secs ? Math.round(words.length / (secs / 60)) : 0,
    differentWords: new Set(words).size, sentences: (text.match(/[.!?]+/g) || []).length || (words.length ? 1 : 0),
    connectors: CONNECTORS.filter(c => t.includes(' ' + c + ' ')) };
}
async function toPcm16k(b) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
  const buf = await ctx.decodeAudioData(await b.arrayBuffer());
  const data = buf.getChannelData(0).slice(0); ctx.close();
  return data;
}
let asrPromise = null;
function asr() {
  if (!asrPromise) asrPromise = import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1').then(({ pipeline, env }) => {
    env.allowLocalModels = false; return pipeline('automatic-speech-recognition', 'Xenova/whisper-tiny.en');
  });
  return asrPromise;
}
async function transcribeAndSend(b, m, secs) {
  $('#btns').innerHTML = '<div class="bar"><i id="pb"></i></div><button class="ghost" id="skip" disabled>Continue without the transcript</button>';
  $('#st').textContent = 'Saving your answer… (the first time can take a minute)';
  let done = false;
  const go = (text, mt) => { if (done) return; done = true; clearInterval(prog); send(b, m, text, mt); };
  setTimeout(() => { const s = $('#skip'); if (s && !done) s.disabled = false; }, 15000);
  $('#skip').onclick = () => go('', { seconds: Math.round(secs), note: 'no transcript' });
  let p = 5; const prog = setInterval(() => { p = Math.min(92, p + 4); const el = $('#pb'); if (el) el.style.width = p + '%'; }, 1000);
  try {
    const model = await asr();
    const out = await model(await toPcm16k(b), { chunk_length_s: 30, stride_length_s: 5 });
    const text = String((out && out.text) || '').trim();
    go(text, metrics(text, secs));
  } catch (e) {
    console.warn('Transcript not available:', e);
    go('', { seconds: Math.round(secs), note: 'no transcript' });
  }
}
function send(b, m, text, mt) {
  const T = TASKS[idx], fr = new FileReader();
  fr.onload = () => {
    window.opener.postMessage({ type: 'elp-recording', id: T.id, b64: String(fr.result).split(',')[1], mime: m, transcript: text, metrics: mt }, ORIGIN);
    idx++;
    if (idx < TASKS.length) { showTask(false); return; }
    stream.getTracks().forEach(t => t.stop());
    $('#cnt').textContent = '';
    app.innerHTML = '<p class="state" style="color:#1f7a70;font-size:22px;margin-top:40px">✓ Your answers were added to your test.</p><p class="note">This window will close. Go back to the test and press Send Speaking.</p>';
    setTimeout(() => window.close(), 2500);
  };
  fr.readAsDataURL(b);
}
</script>
</body>
</html>
